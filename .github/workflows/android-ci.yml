name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # El proyecto necesita el wrapper versionado para compilar desde un clone limpio.
      - name: Verify Gradle wrapper
        run: |
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      # debug.keystore está en .gitignore (nunca debe versionarse), pero signingConfigs.debugConfig
      # lo referencia. En CI se genera el keystore estándar de depuración de Android.
      # Guardrail estático: ningún módulo fuera de `domain/security` puede abrir un shell por su
      # cuenta. El LLM propone herramientas, no comandos, y esta comprobación lo mantiene así.
      - name: Shell execution guard
        run: |
          # 1. Ningún módulo fuera de domain/security puede crear procesos.
          hits=$(grep -rn "ProcessBuilder(" app/src/main/java --include=*.kt \
            | grep -v "domain/security/" || true)
          if [ -n "$hits" ]; then
            echo "::error title=ProcessBuilder fuera de domain/security::$hits"
            exit 1
          fi
          # 2. Y nadie puede invocar su/su -c/sh -c saltándose ShellRunner (que aplica
          #    RootCommandPolicy). Antes había tres motores que lo hacían.
          bypass=$(grep -rn 'ProcessBuilder(\|Runtime.getRuntime().exec' app/src/main/java --include=*.kt \
            | grep -v "domain/security/ShellRunner.kt" || true)
          if [ -n "$bypass" ]; then
            echo "::error title=Shell directo fuera de ShellRunner::$bypass"
            exit 1
          fi

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # El log de Actions no siempre es accesible desde fuera: publicamos los errores de Gradle
      # como anotaciones del check para que se puedan leer desde la API y en la UI del PR.
      - name: Assemble debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            errors=$(grep -E "^(e: |> Task .*FAILED|FAILURE:|\* What went wrong|Caused by:|Execution failed)" -A2 build.log | head -80 | tr '\n' '~' | tr -d '\r')
            echo "::error title=Gradle assembleDebug failed::${errors}"
            exit "$status"
          fi

      - name: Unit tests (JVM + Robolectric)
        if: success()
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            errors=$(grep -E "^(e: |> Task .*FAILED|FAILURE:|\* What went wrong|Caused by:|Execution failed|[A-Za-z0-9_.]+Test >)" -A2 tests.log | head -80 | tr '\n' '~' | tr -d '\r')
            echo "::error title=Unit tests failed::${errors}"
            exit "$status"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore
