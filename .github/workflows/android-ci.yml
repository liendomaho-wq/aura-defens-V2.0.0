name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  # Permite lanzar la compilación del APK desde cualquier rama a mano.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # El proyecto necesita el wrapper versionado para compilar desde un clone limpio.
      - name: Verify Gradle wrapper
        run: |
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      # debug.keystore está en .gitignore (nunca debe versionarse), pero signingConfigs.debugConfig
      # lo referencia. En CI se genera el keystore estándar de depuración de Android.
      # Guardrail estático: ningún módulo fuera de `domain/security` puede abrir un shell por su
      # cuenta. El LLM propone herramientas, no comandos, y esta comprobación lo mantiene así.
      - name: Shell execution guard
        run: |
          # 1. Ningún módulo fuera de domain/security puede crear procesos.
          hits=$(grep -rn "ProcessBuilder(" app/src/main/java --include=*.kt \
            | grep -v "domain/security/" || true)
          if [ -n "$hits" ]; then
            echo "::error title=ProcessBuilder fuera de domain/security::$hits"
            exit 1
          fi
          # 2. Y nadie puede invocar su/su -c/sh -c saltándose ShellRunner (que aplica
          #    RootCommandPolicy). Antes había tres motores que lo hacían.
          bypass=$(grep -rn 'ProcessBuilder(\|Runtime.getRuntime().exec' app/src/main/java --include=*.kt \
            | grep -v "domain/security/ShellRunner.kt" || true)
          if [ -n "$bypass" ]; then
            echo "::error title=Shell directo fuera de ShellRunner::$bypass"
            exit 1
          fi

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # El log de Actions no siempre es accesible desde fuera: publicamos los errores de Gradle
      # como anotaciones del check para que se puedan leer desde la API y en la UI del PR.
      - name: Assemble debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            errors=$(grep -E "^(e: |> Task .*FAILED|FAILURE:|\* What went wrong|Caused by:|Execution failed)" -A2 build.log | head -80 | tr '\n' '~' | tr -d '\r')
            echo "::error title=Gradle assembleDebug failed::${errors}"
            exit "$status"
          fi

      - name: Unit tests (JVM + Robolectric)
        if: success()
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            errors=$(grep -E "^(e: |> Task .*FAILED|FAILURE:|\* What went wrong|Caused by:|Execution failed|[A-Za-z0-9_.]+Test >)" -A2 tests.log | head -80 | tr '\n' '~' | tr -d '\r')
            echo "::error title=Unit tests failed::${errors}"
            exit "$status"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

  # Los tests instrumentados son los únicos que prueban SQLCipher de verdad y las migraciones
  # Room 1→2→3→4. Antes existían pero no se ejecutaban en ninguna parte, así que la base cifrada
  # podía romperse sin que nadie se enterara.
  instrumented-tests:
    name: Instrumented tests (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # El emulador con KVM solo está disponible en runners x86_64 de Linux.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      # Diagnóstico del runner: se publica como anotaciones ::notice para poder leerlo
      # aunque el emulador no llegue a arrancar (el log del job no es accesible desde fuera).
      - name: Emulator environment probe
        run: |
          echo "::notice title=kvm::$(ls -l /dev/kvm 2>&1)"
          echo "::notice title=id::$(id 2>&1)"
          echo "::notice title=android_home::${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "::notice title=sdk contents::$(ls "${ANDROID_HOME:-/nonexistent}" 2>&1)"
          echo "::notice title=cmdline-tools::$(ls "${ANDROID_HOME:-/nonexistent}/cmdline-tools" 2>&1)"
          echo "::notice title=sdkmanager::$(ls "${ANDROID_HOME:-/nonexistent}/cmdline-tools/latest/bin/sdkmanager" 2>&1)"
          echo "::notice title=system images::$(ls "${ANDROID_HOME:-/nonexistent}/system-images" 2>&1)"
          echo "::notice title=disk::$(df -h / | tail -1)"
          echo "::notice title=mem::$(free -h | sed -n 2p)"
          echo "::notice title=cpus::$(nproc)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run instrumented tests (SQLCipher + migraciones)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest --stacktrace > itest.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              errors=$(grep -E "^(e: |> Task .*FAILED|FAILURE:|\* What went wrong|Caused by:|Execution failed|[A-Za-z0-9_.]+Test|Instrumentation)" -A3 itest.log | head -150 | tr "\n" "~" | tr -d "\r")
              echo "::error title=Instrumented tests failed::${errors}"
              tail -n 30 itest.log | tr "\n" "~" | tr -d "\r" | sed "s/^/::error title=log tail::/"
              exit "$status"
            fi

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore
